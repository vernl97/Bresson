[package]
name = "opticfilm"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Driver for Plustek OpticFilm USB film scanners (Genesys ASIC), ported from pyopticfilm"

[dependencies]
base64 = "0.22"
dirs = "7.0.0"
flate2 = "1.1.10"
log = "0.4"
ndarray = "0.17"
num-complex = "0.4"
nusb = "0.2"
rayon = "1.12.0"
realfft = "3.5"
rustfft = "6.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha1 = "0.10"
thiserror = "2"
tiff = "0.11.3"

[dev-dependencies]
sha2 = "0.10"

[[bin]]
name = "opticfilm"
path = "src/bin/opticfilm.rs"
