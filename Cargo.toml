[package]
name = "nlp_studio"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
ab_glyph = "0.2"
bytemuck = { version = "1.25", features = ["derive"] }
dirs = "7.0.0"
eframe = "0.35.0"
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["tiff", "jpeg", "png", "rayon"] }
rawler = "0.8.0"
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiff = "0.11.3"

[dev-dependencies]
pollster = "0.4"
egui_kittest = { version = "0.35", features = ["wgpu", "snapshot", "eframe"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", features = ["NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder", "NSApplication"] }
